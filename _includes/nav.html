{% assign p = page.url %}
<header class="nav{% if page.nav_static or p contains '/docs/' %} nav-static{% endif %}" role="navigation" aria-label="Main">
  <div class="nav-inner">
    <a class="nav-logo" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/img/logo.svg' | relative_url }}" alt="Miri logo">
      <span>Miri</span>
    </a>
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
    </button>
    <nav class="nav-links">
      <a href="{{ '/#features' | relative_url }}">features</a>
      <a href="{{ '/#examples' | relative_url }}">examples</a>
      <a class="{% if p contains '/gpu-demos' %}active{% endif %}" href="{{ '/gpu-demos/' | relative_url }}">gpu demos</a>
      <a class="{% if p contains '/docs' %}active{% endif %}" href="{{ '/docs/' | relative_url }}">docs</a>
      <a class="nav-cta" href="{{ site.github_url }}" target="_blank" rel="noopener">GitHub ↗</a>
    </nav>
  </div>
</header>
