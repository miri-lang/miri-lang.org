- title: "Clean Syntax"
  icon: "&#x2728;"
  description: "Indentation-based blocks, no braces or semicolons. Balanced readability, expressiveness, and safety."

- title: "AI-Assisted Development"
  icon: "&#x1f916;"
  description: "Designed with clear, consistent semantics that make AI code generation and assistance highly effective."

- title: "Static Typing &amp; Type Inference"
  icon: "&#x1f3af;"
  description: "Catch errors at compile time with a powerful type system that stays out of your way. Types are inferred where possible."

- title: "Native Compilation"
  icon: "&#x2699;"
  description: "Compiles to native machine code via Cranelift. Fast compilation, fast execution, small binaries."

- title: "Pattern Matching"
  icon: "&#x1f500;"
  description: "Exhaustive pattern matching with destructuring across enums, structs, tuples, and literals. Guard clauses included."

- title: "Option Types &amp; Null Safety"
  icon: "&#x1f6e1;"
  description: "The ? type suffix marks values that may be absent. The compiler prevents use without checking — no null pointer errors."

- title: "Memory Safety"
  icon: "&#x1f512;"
  description: "Invisible ownership with optimized reference counting. Copy-on-Write collections give value semantics with reference-pass speed. Use-after-move is caught at compile time via escape analysis. The compiler elides RC entirely on linear flows. The only memory keyword you ever write is `out`."

- title: "Classes &amp; Inheritance"
  icon: "&#x1f3db;"
  description: "Full OOP with constructors, visibility modifiers, single inheritance, abstract classes, super calls, and runtime virtual dispatch via vtables."

- title: "Traits &amp; Generics"
  icon: "&#x1f9ec;"
  description: "Trait interfaces with default methods and inheritance chains. Generic functions, structs, and classes monomorphized at compile time."

- title: "First-Class Closures"
  icon: "&#x1f517;"
  description: "Lambdas that capture variables by value. Pass them as arguments, store in variables, return from functions. Compiled to native fat pointers."

- title: "GPU-First Programming"
  icon: "&#x1f680;"
  description: "GPU kernels live alongside CPU code in the same language — no shader files, no FFI. Mark a binding gpu, launch with forall, and every upload, launch, and readback is visible in the source. Runs natively and in the browser via WebGPU."

- title: "Async &amp; Parallelism"
  icon: "&#x26a1;"
  description: "First-class async/await and parallel primitives make concurrent programming intuitive and safe."
  coming_soon: true
