title: Miri Programming Language
# The positioning sentence, and the only copy of it: the homepage inherits this as
# its meta description, and _includes/schema.html emits it as the WebSite
# description. 154 chars — inside the 140–160 window Google renders without
# truncating. It names a concrete capability instead of asserting adjectives, and
# deliberately drops the old "in the age of Generative AI" line, which has no
# search volume and dates the copy.
description: >-
  Miri is a statically typed, natively compiled programming language with
  first-class GPU programming: mark data gpu, launch with forall, no CUDA toolchain.
url: "https://miri-lang.org"
baseurl: ""

github_url: "https://github.com/miri-lang/miri"
author: "Viacheslav Shynkarenko"

# ---------------------------------------------------------------------------
# Entity identity — the single source of truth for the JSON-LD emitted by
# _includes/schema.html.
#
# "Miri" is a short, widely-used name — a city, a given name, and unrelated
# software all share it — so the bare word is not winnable and is not the target.
# Everything here aims at the *compound* entity ("Miri programming language",
# "Miri lang", "miri-lang") and defines Miri positively, by category. We do not
# name other projects: that would frame Miri against them and put their names in
# front of readers who never had the association. Disambiguation is carried by
# the entity markup, the alternate names, `sameAs`, and later a Wikidata item.
#
# `positioning` must stay character-for-character identical to the GitHub repo
# About line and the README H1 — entity consistency across the two properties
# Google actually trusts.
# ---------------------------------------------------------------------------
entity:
  positioning: "Miri: GPU-first programming language"
  name: "Miri"
  alternate_names:
    - "Miri Lang"
    - "Miri programming language"
    - "miri-lang"
  # Kept separate from site.description: this is the definitional paragraph an
  # answer engine quotes back, so it is written to stand alone and to place Miri
  # in its category in the first clause. It is word-for-word the lead paragraph
  # of the "What is Miri?" block on the homepage (index.html, `.answer-lead`),
  # minus the <code> markup — edit one, edit the other, so what a crawler reads
  # in the markup and what a reader sees on the page cannot drift apart.
  description: >-
    Miri is a statically typed, natively compiled programming language with
    first-class GPU programming built into the language rather than bolted on
    through a library. You mark data gpu to make it device-resident and launch a
    kernel with forall; the compiler infers every upload, launch and readback.
    Kernels compile to WGSL and run on Metal, Vulkan, DX12 and WebGPU; host code
    compiles to native machine code through Cranelift. There are no shader files,
    no FFI layer and no CUDA toolchain.
  operating_systems: "macOS, Linux, Windows"
  license_url: "https://www.apache.org/licenses/LICENSE-2.0"
  keywords: "GPU-first programming language, single-source GPU programming, WGSL, WebGPU, compiler, Cranelift, statically typed, systems programming"
  # sameAs — the properties Google can use to fuse them into one entity. Only
  # URLs that actually resolve belong here; a 404 in sameAs is a negative signal,
  # so the not-yet-created ones stay commented until they exist (see P3-3).
  same_as:
    - "https://github.com/miri-lang"
    - "https://github.com/miri-lang/miri"
  # - "https://www.wikidata.org/wiki/Q000000"  # P3-3 — create the Wikidata item
  # - "https://x.com/..."                      # P3-3 — once the account exists
  # - "https://discord.gg/..."                 # P3-3 — once the server exists
  # - "https://pldb.io/concepts/miri.html"     # P3-3 — once the PLDB entry is live

# ---------------------------------------------------------------------------
# Legal pages — /impressum/ and /datenschutz/
#
# §5 DDG requires a *ladungsfähige Anschrift* — a real street address where legal
# service can be effected. A Postfach does NOT satisfy this. A c/o address from an
# Impressum service does. Same details as slavikdev.com, which is operated by the
# same person; the two sites deliberately share one verified address.
# ---------------------------------------------------------------------------
legal:
  legal_name: 'Viacheslav Shynkarenko'   # Klarname — the Impressum service requires the
                                         # real name, not the byline or a pseudonym
  known_as: 'Slavik Shynkarenko'         # name used publicly
  # Impressum-service address (Anschrift.net / COCENTER), set up 2026-08-15. The service
  # instructs that ONLY this address be published — do not add a home city or region.
  care_of: 'c/o COCENTER'                # rendered on its own line, per their Muster
  street: 'Koppoldstr. 1'
  postal_code: '86551'
  city: 'Aichach'
  country: 'Germany'
  email: 'slavik@slavikdev.com'          # rendered scrape-hardened via _includes/email.html
  # Supervisory authority for data-protection complaints. Aichach is in Bavaria, and so
  # is Munich, so BayLDA is competent whether jurisdiction follows the service address or
  # the actual establishment.
  supervisory_authority: 'Bayerisches Landesamt für Datenschutzaufsicht (BayLDA), Promenade 18, 91522 Ansbach'
  supervisory_authority_url: 'https://www.lda.bayern.de/'
  # Flip to true only if the Cloudflare Web Analytics snippet is actually enabled.
  cloudflare_web_analytics: false

markdown: kramdown
kramdown:
  input: GFM

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - tools
  - notes
